name: Build Debug APK

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install pinned debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK (clean, no cache)
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK contains our classes
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== APK contents (classes dex count) ==="
          unzip -l "$APK" | grep -c 'classes.*\.dex' || true
          echo "=== Is our MainActivity in the dex? ==="
          COUNT=$(unzip -p "$APK" 'classes*.dex' 2>/dev/null | strings | grep -c 'com/shopassistant/MainActivity' || echo 0)
          echo "com/shopassistant/MainActivity occurrences: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: MainActivity not in APK. Packaging failed."
            exit 1
          fi
          echo "OK: MainActivity found in APK."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shop-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
